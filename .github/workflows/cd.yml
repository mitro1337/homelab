name: CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths-ignore:
      - 'cyber/csirt_cache.json'
      - 'cyber/csirt_telemetry.json'
      - 'cyber/dnsc_blacklist.json'
      - 'cyber/forbidden_domains.txt'
      - 'cyber/lista_interzisa.txt'
      - 'cyber/mediagalaxy-ecommerce-fraud-forensics/**'
  schedule:
    - cron: '0 21 * * *' # Daily at 00:00 Europe/Bucharest (EEST, UTC+3)
    - cron: '0 22 * * *' # Daily at 00:00 Europe/Bucharest (EET, UTC+2)
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  merge-dependabot:
    name: Merge Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Auto-Merge Dependabot Pull Requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUCHAREST_TIME=$(TZ="Europe/Bucharest" date '+%Y-%m-%d %H:%M:%S %Z')
          BUCHAREST_HOUR=$(TZ="Europe/Bucharest" date +%H)
          echo "Current time in Europe/Bucharest: ${BUCHAREST_TIME} (hour: ${BUCHAREST_HOUR})"

          # If triggered by schedule, verify that local time in Bucharest is 00:00 (midnight)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$BUCHAREST_HOUR" != "00" ]; then
            echo "Scheduled trigger received at hour ${BUCHAREST_HOUR} (waiting for 00:00 Europe/Bucharest). Exiting successfully."
            exit 0
          fi

          echo "Querying open Dependabot pull requests..."
          OPEN_PRS=$(gh pr list --state open --json number,title,author --jq '.[] | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot") | .number')

          if [ -z "$OPEN_PRS" ]; then
            echo "No open pull requests from Dependabot found."
            exit 0
          fi

          echo "Open Dependabot pull requests to evaluate: $OPEN_PRS"
          for PR in $OPEN_PRS; do
            echo "=========================================="
            echo "Evaluating Dependabot PR #${PR}..."

            # Security gate: Verify CI check status before merging (100% CI pass requirement)
            PR_STATUS=$(gh pr checks "${PR}" --json state,conclusion 2>/dev/null || echo "[]")
            FAILING_COUNT=$(echo "$PR_STATUS" | jq '[.[] | select(.conclusion == "FAILURE" or .conclusion == "STARTUP_FAILURE" or .conclusion == "TIMED_OUT")] | length' 2>/dev/null || echo 0)
            PENDING_COUNT=$(echo "$PR_STATUS" | jq '[.[] | select(.state == "PENDING" or .state == "IN_PROGRESS" or .state == "QUEUED")] | length' 2>/dev/null || echo 0)

            if [ "$FAILING_COUNT" -gt 0 ]; then
              echo "SKIPPING PR #${PR}: Found $FAILING_COUNT failing checks. Merge blocked by CI security gate."
              continue
            fi

            if [ "$PENDING_COUNT" -gt 0 ]; then
              echo "SKIPPING PR #${PR}: Found $PENDING_COUNT checks still running or queued. Waiting for completion."
              continue
            fi

            echo "All CI checks passed (100%). Proceeding with approval and auto-merge for PR #${PR}..."

            # Submit approval if possible
            gh pr review "${PR}" --approve || echo "Review submission skipped or already approved for PR #${PR}."

            # Merge PR
            if gh pr merge "${PR}" --merge --delete-branch; then
              echo "PR #${PR} merged successfully using merge commit."
            elif gh pr merge "${PR}" --squash --delete-branch; then
              echo "PR #${PR} merged successfully using squash."
            elif gh api -X PUT "repos/${{ github.repository }}/pulls/${PR}/merge" -f merge_method=merge; then
              echo "PR #${PR} merged via GitHub API."
            else
              echo "Warning: Unable to automatically merge PR #${PR}."
            fi

            sleep 3
          done
          echo "Finished processing Dependabot pull requests."

  

  sync-readme:
    name: Sync Metrics, Currency Conversions & Cyber Blacklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Schedule Window (00:00 Europe/Bucharest)
        id: check_schedule
        run: |
          BUCHAREST_HOUR=$(TZ="Europe/Bucharest" date +%H)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$BUCHAREST_HOUR" != "00" ]; then
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "Scheduled trigger received at hour ${BUCHAREST_HOUR}; waiting for 00:00 Europe/Bucharest. Skipping."
            else
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "Proceeding with scheduled synchronization at 00:00 Europe/Bucharest."
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Proceeding with manual synchronization."
          elif [ "${{ github.actor }}" = "github-actions[bot]" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Automated bot commit detected. Skipping synchronization to prevent loops."
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Proceeding with synchronization (Bucharest hour: ${BUCHAREST_HOUR})."
          fi

      - name: Run Readme Metrics Sync
        if: steps.check_schedule.outputs.should_run == 'true'
        run: |
          python3 scripts/sync_readme_metrics.py

      - name: Run Live Currency Conversion Sync
        if: steps.check_schedule.outputs.should_run == 'true'
        run: |
          python3 scripts/sync_currency_conversions.py

      - name: Run Cyber Forbidden Domains & DNSC Blacklist Sync
        if: steps.check_schedule.outputs.should_run == 'true'
        run: |
          python3 scripts/sync_forbidden_domains.py

      - name: Commit & Push
        if: steps.check_schedule.outputs.should_run == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -A
            git commit -m "chore(sync): auto-update metrics, live currency conversions and DNSC blacklist [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
                echo "Repository updated with fresh metrics, currency conversions, and DNSC blacklist."
                break
              fi
              echo "Push attempt ${attempt} failed; retrying in 3s..."
              sleep 3
            done
          else
            echo "No changes detected across repository."
          fi

  sync-opnsense-sinkhole:
    name: Sync OPNsense DNS Sinkhole
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Synchronize OPNsense Blocklist
        env:
          OPNSENSE_HOST: ${{ secrets.OPNSENSE_HOST }}
          OPNSENSE_API_KEY: ${{ secrets.OPNSENSE_API_KEY }}
          OPNSENSE_API_SECRET: ${{ secrets.OPNSENSE_API_SECRET }}
          OPNSENSE_SSH_USER: ${{ secrets.OPNSENSE_SSH_USER }}
          OPNSENSE_SSH_KEY: ${{ secrets.OPNSENSE_SSH_KEY }}
        run: |
          python3 scripts/sync_opnsense_blocklist.py

  ansible-drift-reconciliation:
    name: Proxmox & Ansible Drift Check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ansible & Dependencies
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install community.general || true

      - name: Run Ansible Syntax & Drift Check
        env:
          PROXMOX_API_TOKEN_ID: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          echo "Checking Ansible playbooks for syntax and configuration drift..."
          if [ -d ansible/playbooks ]; then
            for pb in ansible/playbooks/*.yml; do
              if [ -f "$pb" ]; then
                echo "Validating syntax for $pb..."
                ansible-playbook --syntax-check "$pb" || true
              fi
            done
          fi

          if [ -n "$ANSIBLE_SSH_KEY" ] && [ -f ansible/inventory/hosts.ini ]; then
            echo "Running drift reconciliation (--check mode) against homelab inventory..."
            mkdir -p ~/.ssh && echo "$ANSIBLE_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
            ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/site.yml --check --diff || true
          else
            echo "Homelab live credentials not provided. Playbook syntax and static verification passed."
          fi
