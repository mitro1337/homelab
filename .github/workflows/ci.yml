name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  security-events: write

jobs:
  secrets-audit:
    name: Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: TruffleHog Git Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: ShellCheck
        run: |
          find scripts cyber -name "*.sh" -exec shellcheck -e SC1091 -e SC2086 {} + || true

      - name: YAML Lint
        run: |
          command -v yamllint >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq yamllint || true
          yamllint -d "{extends: default, rules: {line-length: {max: 300}, document-start: disable, truthy: disable}}" . || true

      - name: Markdown Lint
        run: |
          npx markdownlint-cli "**/*.md" --ignore node_modules --ignore web/dist || true

      - name: Currency Conversions Check
        run: |
          python3 scripts/sync_currency_conversions.py --check || echo "::warning::Currency rates have updated upstream; CD pipeline will synchronize on merge."

      - name: Forbidden Domains & DNSC Blacklist Check
        run: |
          python3 scripts/sync_forbidden_domains.py --check || echo "::warning::DNSC blacklist or local forbidden domains have updated upstream; CD pipeline will synchronize on merge."

      - name: IoC List Hygiene & Format Check
        run: |
          python3 scripts/verify_ioc_hygiene.py

      - name: Suricata Rules Syntax Gate
        run: |
          python3 scripts/verify_suricata_rules.py

      - name: Master Infrastructure Health Audit
        run: |
          python3 scripts/audit_infrastructure.py

      - name: DFIR PDF Report Smoke-Test
        run: |
          python3 -m pip install reportlab
          TMP_REPORT="/tmp/dfir_smoke_test_$(date +%s).pdf"
          python3 cyber/mediagalaxy-ecommerce-fraud-forensics/reports/generate_report.py "$TMP_REPORT"
          test -s "$TMP_REPORT"
          head -c 5 "$TMP_REPORT" | grep -q "%PDF-"
          echo "DFIR PDF Report generation verified successfully ($TMP_REPORT)."


      - name: ESP32 Edge Firmware Suite Audit
        run: |
          python3 scripts/verify_esp32_firmware.py

      - name: Zero-Cost Cloud Guardrail Static Audit
        run: |
          python3 scripts/verify_zero_cloud_cost.py

      - name: Mermaid Diagram Quoting & Syntax Audit
        run: |
          python3 scripts/audit_mermaid_diagrams.py

      - name: Commit Lint
        uses: wagoid/commitlint-github-action@v6
        continue-on-error: true

  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trivy Repository Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true

      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true

  iac-validate:
    name: IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.0

      - name: Check Terraform Formatting
        run: |
          terraform fmt -check -recursive terraform/ || echo "::warning::Terraform files in terraform/ require formatting (run 'terraform fmt -recursive terraform/')"
          terraform fmt -check -recursive cloud/ || echo "::warning::Terraform files in cloud/ require formatting (run 'terraform fmt -recursive cloud/')"

      - name: Validate Terraform Modules
        run: |
          for dir in terraform terraform/modules/proxmox_lxc terraform/modules/proxmox_vm terraform/proxmox cloud/azure cloud/gcp cloud/aws; do
            if [ -d "$dir" ]; then
              echo "Validating $dir..."
              (cd "$dir" && terraform init -backend=false && terraform validate) || true
            fi
          done

      - name: Set up Python 3.12 for Ansible
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Ansible Playbooks
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install community.general || true
          if [ -d "ansible" ]; then
            ansible-lint ansible/ || true
          fi
          if [ -d ansible/playbooks ]; then
            for pb in ansible/playbooks/*.yml; do
              [ -f "$pb" ] && ansible-playbook --syntax-check "$pb" || true
            done
          fi
          if [ -f ai/ansible/playbook.yml ]; then
            ansible-playbook --syntax-check ai/ansible/playbook.yml || true
          fi

      - name: Validate Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config -q || true
          fi
          find services cyber -name "docker-compose*.yml" -o -name "compose*.yaml" | while read -r comp; do
            echo "Validating $comp..."
            docker compose -f "$comp" config -q || true
          done

      - name: Test Nginx Configurations
        run: |
          docker run --rm -v "${PWD}:/workspace" -w /workspace nginx:alpine sh -c "
            find . -name '*.conf' -path '*/nginx/*' -exec nginx -t -c {} \; 2>/dev/null || true
          "

      - name: Validate Kubernetes Manifests
        run: |
          for i in 1 2 3; do
            curl -fSL --connect-timeout 10 --retry 3 https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz && sudo mv kubeconform /usr/local/bin/ && break || sleep 2
          done
          if [ -d kubernetes ] && command -v kubeconform &> /dev/null; then
            find kubernetes -type f \( -name "*.yaml" -o -name "*.yml" \) -exec kubeconform -summary -ignore-missing-schemas {} + || true
          fi


      - name: Validate Renovate Config
        run: |
          if [ -f .github/renovate.json ] || [ -f renovate.json ]; then
            docker run --rm -v "${PWD}:/usr/src/app" -w /usr/src/app renovate/renovate:latest renovate-config-validator || true
          else
            echo "No Renovate configuration found. Skipping validation."
          fi

      - name: Render Terraform Docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform/modules/proxmox_lxc,terraform/modules/proxmox_vm,terraform/proxmox
          output-file: README.md
          output-method: replace
          fail-on-diff: false

  web-build:
    name: Web Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci || npm install --legacy-peer-deps

      - name: Build Frontend
        run: |
          cd web
          npm run build

      - name: Validate Output
        run: |
          test -f web/dist/index.html
          echo "Frontend build completed."

  backend-jvm-tests:
    name: Backend Test Suite (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect JVM Projects & Run Tests
        run: |
          echo "Scanning for Maven / Gradle backend microservices..."
          GRADLE_PROJECTS=$(find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/.*" -not -path "*/node_modules/*")
          MAVEN_PROJECTS=$(find . -maxdepth 3 -name "pom.xml" -not -path "*/.*" -not -path "*/node_modules/*")

          if [ -z "$GRADLE_PROJECTS" ] && [ -z "$MAVEN_PROJECTS" ]; then
            echo "No Java/Kotlin/JVM microservices detected in repository. JVM gate completed (noop)."
            exit 0
          fi

          echo "Detected JVM microservices. Configuring JDK Temurin 21..."
          if [ -n "$GRADLE_PROJECTS" ]; then
            for proj in $GRADLE_PROJECTS; do
              PROJ_DIR=$(dirname "$proj")
              echo "Executing Gradle test suite in $PROJ_DIR..."
              if [ -f "$PROJ_DIR/gradlew" ]; then
                (cd "$PROJ_DIR" && chmod +x ./gradlew && ./gradlew test --no-daemon)
              else
                gradle -p "$PROJ_DIR" test
              fi
            done
          fi

          if [ -n "$MAVEN_PROJECTS" ]; then
            for proj in $MAVEN_PROJECTS; do
              PROJ_DIR=$(dirname "$proj")
              echo "Executing Maven test suite in $PROJ_DIR..."
              mvn -B test -f "$proj"
            done
          fi

  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stress-ng iproute2 curl jq
          chmod +x scripts/chaos/chaos_runner.sh

      - name: Start Staging Container
        run: |
          echo "Starting staging container..."
          docker run -d --name staging-microservice --restart=always -p 8088:80 nginx:alpine
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8088 > /dev/null 2>&1 && break || sleep 1
          done
          curl -fsS http://localhost:8088 > /dev/null
          echo "Staging container ready."

      - name: CPU & Memory Stress Test
        run: |
          bash scripts/chaos/chaos_runner.sh cpu-stress 10
          bash scripts/chaos/chaos_runner.sh ram-pressure 10

      - name: Service Fault & Recovery Test
        run: |
          bash scripts/chaos/chaos_runner.sh service-kill 5 staging-microservice
          bash scripts/chaos/chaos_runner.sh auto-healing-check 30 staging-microservice
          docker ps --filter "name=staging-microservice"

      - name: Network Degradation Test
        run: |
          bash scripts/chaos/chaos_runner.sh network-latency 5 lo 50ms || true
          bash scripts/chaos/chaos_runner.sh packet-loss 5 lo 10% || true

      - name: Alert Webhooks Test
        env:
          UPTIME_KUMA_URL: ${{ secrets.UPTIME_KUMA_PUSH_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash scripts/chaos/chaos_runner.sh alert-webhook-validate

      - name: Cleanup
        if: always()
        run: |
          docker rm -f staging-microservice 2>/dev/null || true
          echo "Staging environment cleaned up."

  cloud-zero-cost-guardrail:
    name: Cloud Zero-Cost ($0.00) Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Execute Zero-Cost Static Guardrail
        run: |
          python3 scripts/verify_zero_cloud_cost.py

      - name: Check Free-Tier SKU Whitelist
        run: |
          echo "[GUARDRAIL] Verifying that no paid NAT Gateways, ALBs, or non-free instances exist..."
          ! grep -rn "aws_nat_gateway" cloud/ || (echo "ERROR: aws_nat_gateway found! Billable cloud resource forbidden." && exit 1)
          ! grep -rn "google_compute_router_nat" cloud/ || (echo "ERROR: google_compute_router_nat found! Billable cloud resource forbidden." && exit 1)
          ! grep -rn "azurerm_nat_gateway" cloud/ || (echo "ERROR: azurerm_nat_gateway found! Billable cloud resource forbidden." && exit 1)
          echo "[GUARDRAIL] Passed. All cloud manifests adhere to strict $0.00 free-tier constraints."

