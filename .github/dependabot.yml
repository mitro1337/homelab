version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 10

  # Web Frontend (Angular 20)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postcss-selector-parser"
    groups:
      angular:
        patterns:
          - "@angular/*"

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tf-deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/cloud/azure"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tf-deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/cloud/aws"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tf-deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/cloud/gcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tf-deps)"
    open-pull-requests-limit: 5

  # Docker Compose Services
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-deps)"
    open-pull-requests-limit: 5
