<!--
  =============================================================================
  Fragment de configurare Wazuh Manager (/var/ossec/etc/ossec.conf)
  Definește comenzile Active Response prin care SIEM-ul Wazuh ia decizia
  automată de a executa scriptul PowerShell (.ps1), scriptul Bash (.sh)
  și Playbook-ul Ansible atunci când regulile Fuzzy 110502 (Level 12) sau
  110503 (Level 15) sunt activate.
  =============================================================================
-->
<ossec_config>

  <!-- Ingestia fișierului JSONL generat de motorul AD-Fuzzy-SOAR -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/ossec/logs/wazuh_fuzzy_events.jsonl</location>
  </localfile>

  <!-- Comanda Active Response pentru Windows Active Directory (.ps1) -->
  <command>
    <name>ad-fuzzy-win-response</name>
    <executable>ad_response.ps1</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Comanda Active Response pentru Linux Domain Nodes (.sh) -->
  <command>
    <name>ad-fuzzy-linux-response</name>
    <executable>linux_ad_response.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Comanda Active Response pe Wazuh Manager care lansează Playbook-ul Ansible -->
  <command>
    <name>ad-fuzzy-ansible-playbook</name>
    <executable>run_ansible_soar.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- Politica de decizie Wazuh Active Response pentru regulile Fuzzy 110502 (HIGH) și 110503 (CRITICAL) -->
  <active-response>
    <disabled>no</disabled>
    <command>ad-fuzzy-ansible-playbook</command>
    <location>server</location>
    <rules_id>110502,110503</rules_id>
  </active-response>

  <active-response>
    <disabled>no</disabled>
    <command>ad-fuzzy-win-response</command>
    <location>local</location>
    <rules_id>110502,110503</rules_id>
    <timeout>1800</timeout>
  </active-response>

  <active-response>
    <disabled>no</disabled>
    <command>ad-fuzzy-linux-response</command>
    <location>local</location>
    <rules_id>110502,110503</rules_id>
    <timeout>1800</timeout>
  </active-response>

</ossec_config>
