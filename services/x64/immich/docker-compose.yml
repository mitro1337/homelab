name: immich

services:
  # ============================================================================
  # 1. IMMICH SERVER (Principal API, Web UI, Microservices)
  # ============================================================================
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION:-/data/photos}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  # ============================================================================
  # 2. MACHINE LEARNING ENGINE (Facial Recognition & CLIP Semantic Search)
  # ============================================================================
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  # ============================================================================
  # 3. REDIS (Caching, Image/Video Processing Queues)
  # ============================================================================
  redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine@sha256:d823aa60e206019f2a4f4817a3f81e3557a164ab08b0eb10c9b0cf2b694b88d3
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping || exit 1" ]
    restart: always

  # ============================================================================
  # 4. POSTGRESQL + PGVECTOR (Relational Storage & Vector Search)
  # ============================================================================
  database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.1@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION:-./config/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=${DB_USERNAME:-postgres} --dbname=${DB_DATABASE_NAME:-immich} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  model-cache:
